name: Bug report
description: Report a reproducible PlainJot problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PlainJot version or commit
      placeholder: 0.2.0 or commit hash
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and hardware
      placeholder: macOS 15.6, Apple silicon
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Relevant files or logs
      description: Remove private note content and secrets before pasting anything.
